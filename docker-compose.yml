version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mugen_postgres
    restart: always
    environment:
      POSTGRES_DB: mugen_db
      POSTGRES_USER: mugen_user
      POSTGRES_PASSWORD: mugen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: